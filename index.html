<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0" />
  <title>Busca CEP - Dona Lucinda</title>
  <link rel="icon" type="image/png" sizes="32x32" href="img/iconwhite.svg">

  <!-- CSS  -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="css/materialize.css" type="text/css" rel="stylesheet" media="screen,projection" />
  <link href="css/style.css" type="text/css" rel="stylesheet" media="screen,projection" />
</head>

<body>
  <nav class="nav-bar" role="navigation">
    <!-- <div class="nav-wrapper container"><a id="logo-container" href="#" class="brand-logo">Busca CEP - Dona Lucinda</a> -->
      <img src="img/logowhite.svg" alt="Logo Busca CEP - Dona Lucinda" class="logo">
      <ul class="right hide-on-med-and-down">
        <!-- <li><a href="#">Navbar Link</a></li> -->
      </ul>

      <ul id="nav-mobile" class="sidenav">
        <li><a href="#">Navbar Link</a></li>

      </ul>
      <a href="#" data-target="nav-mobile" class="sidenav-trigger"><i class="material-icons">menu</i></a>
    </div>
  </nav>


  <!-- loading -->
  <div class="loading center">
    <div class="preloader-wrapper big active">
      <div class="spinner-layer spinner-blue-only">
        <div class="circle-clipper left">
          <div class="circle"></div>
        </div>
        <div class="gap-patch">
          <div class="circle"></div>
        </div>
        <div class="circle-clipper right">
          <div class="circle"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="section no-pad-bot" id="index-banner">
    <div class="container">
      <div class="row">
        <div class="col s12">
          <ul class="tabs">
            <!-- "barra de navegação" -->
            <li class="tab col s4"><a class="active" href="#tab-cep">CEP</a></li>
            <li class="tab col s4"><a href="#tab-rua">RUA</a></li>
            <li class="tab col s4"><a href="#tab-log">LOGS</a></li>
          </ul>
        </div>
        
        <!-- "Pagina" do cep, onde voce pesquisa por cep-->
        <div id="tab-cep" class="col s12">
          <div class="input-field">
            <label for="cep">CEP</label>
            <input type="number" placeholder="Digite seu CEP" name="cep" id="cep">
          </div>
          <a onclick="buscaCepFetch()" class="waves-effect waves-light btn"><i
              class="material-icons left">search</i>Buscar</a>
          <ul class="collection">
            <li class="collection-item">RUA: <span id="dadoRua"></span></li>
            <li class="collection-item">BAIRRO: <span id="dadoBairro"></span></li>
            <li class="collection-item">CIDADE: <span id="dadoCidade"></span></li>
            <li class="collection-item">ESTADO: <span id="dadoEstado"></span></li>
          </ul>
        </div>


        <!-- "Pagina" da rua, onde voce pesquisa por estado, cidade, rua -->
        <div id="tab-rua" class="col s12">
          <div class="row">
            <div class="col s6">
              <label for="estado">Estado</label>
              <select onchange="pegarCidades()" id="estado" class="browser-default">
                <option value="" disabled selected>Escolha um Estado</option>
              </select>
            </div>
            <div class="col s6">
              <label for="cidade">Cidade</label>
              <select id="cidade" class="browser-default">
                <option value="" disabled selected>Escolha uma Cidade</option>
              </select>
            </div>
            <div class="input-field col s6">
              <i class="material-icons prefix">location_on</i>
              <input id="rua" type="text" class="validate">
              <label for="rua">Rua</label>
            </div>
            <div class="input-field col s6">
              <a onclick="buscaRua()" class="waves-effect waves-light btn"><i
                  class="material-icons right">search</i>Enviar</a>
            </div>
          </div>
          <div id="lista-ruas">
            <!-- Aqui aparecerão as ruas encontradas -->
          </div>
        </div>

        <!-- "Pagina" dos logs, mostrando o histórico das pesquisas -->
        <div id="tab-log" class="col s12">
          <div class="row">
            <div class="col s12">
              <h5>Histórico de Consultas</h5>
              <div class="row left-align">
                <div class="col s12 left-align">
                  <a onclick="carregarLogs()" class="btn blue"><i
                      class="material-icons center">autorenew</i></a>
                  <a onclick="limparLogs()" class="btn red"><i
                      class="material-icons center">delete</i></a>
                </div>
              </div>
            </div>
          </div>
          <div id="lista-logs">
            <!-- Os logs serão carregados aqui -->
          </div>
        </div>
      </div>
    </div>
  </div>


      <!--  Scripts Externos -->
      <script src="https://code.jquery.com/jquery-2.1.1.min.js"></script>
      <script src="js/materialize.js"></script>
      <script src="js/init.js"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
      
      <script src="/js/scripts/cep/buscaCepAjax.js"></script>
        <script src="/js/scripts/cep/buscaCepFetch.js"></script>
        <script src="/js/scripts/cep/buscaCepAxios.js"></script>
        <script src="/js/scripts/rua/buscaRua.js"></script>
        <script src="/js/scripts/rua/pegarCidades.js"></script>
        <script src="/js/scripts/rua/pegarEstados.js"></script>
        <script src="/js/scripts/log/logs.js"></script>
        <script>
          $(".preloader-wrapper").hide()
        </script>

      

</body>

</html>
